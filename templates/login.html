{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center h-100">
    <div class="col-md-4">
        <div class="card cyber-card border-info" style="box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);">
            <div class="card-header border-bottom border-info text-center py-4">
                <h3 class="text-info fw-bold"><i class="bi bi-hexagon-fill me-2"></i>AnalytiX<span
                        class="text-light">Hub</span></h3>
                <p class="text-muted mb-0 small font-monospace">ANALYTIXHUB // AUTHORIZED PERSONNEL ONLY</p>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label text-info small">OFFICER ID / USERNAME</label>
                        <div class="input-group">
                            <span class="input-group-text border-info text-info"><i
                                    class="bi bi-person-badge"></i></span>
                            <input type="text" class="form-control text-light border-info" id="username" name="username"
                                required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label text-info small">ACCESS KEY / PASSWORD</label>
                        <div class="input-group">
                            <span class="input-group-text border-info text-info"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control text-light border-info" id="password"
                                name="password" required>
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-info fw-bold">AUTHENTICATE</button>
                    </div>
                </form>
            </div>
            <div class="card-footer border-top border-info text-center py-3">
                <small class="text-muted">System v4.5 | <i class="bi bi-activity"></i> Online</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
